name: Omni Creator Products
description: >-
  Omni Creator Products (OCP) is a game development platform company founded in
  2021 and based in Raleigh, North Carolina, operating fully remote. Its mission
  is to "empower every player to become a creator" by making game creation and
  modding accessible, intuitive, and magical. OCP's products include Muse, a game
  designed as a scaffold for user-generated content (UGC), and Creator Lab, a
  toolset that lets players remix and build upon existing games. The company
  raised a $16.25M Series A in 2022 with investors including a16z (Andreessen
  Horowitz). As of this enrichment pass OCP publishes no public developer API,
  SDK, documentation, or OpenAPI surface, and its GitHub organization (ocpgg) has
  no public repositories.
